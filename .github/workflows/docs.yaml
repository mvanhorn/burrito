name: Documentation
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - "docs/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Fetch all branches to include 'gh-pages' branch
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mkdocs-material-${{ github.ref }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install mkdocs-material mike

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24
        with:
          config: 'docs/.markdownlint.jsonc'
          globs: 'docs/**/*.md'

      - name: Build pages
        run: mkdocs build --strict

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Deploy pages (unstable)
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases unstable

      - name: Deploy pages (new release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mike deploy --push --update-aliases ${{ github.ref_name }} latest
          echo "Deployed version ${{ github.ref_name }} to GitHub Pages"
